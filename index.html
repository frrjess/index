<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14101c">
<title>AuraFit — your digital wardrobe</title>
<style>
html,body{margin:0;padding:0;min-height:100%;background:#14101c;}

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

.af, .af * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.af {
  --a1:#b794f6; --a2:#f6a5c0; --a3:#f9c784;
  --aura:linear-gradient(135deg,#b794f6,#f6a5c0 55%,#f9c784);
  --danger:#f47a86; --good:#5ad1a6;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  color:var(--text); background:var(--bg);
  min-height:100vh; width:100%; position:relative;
  padding-bottom:150px; overflow-x:hidden;
}
.af[data-theme="dark"]{
  --bg:#14101c; --bg2:#0f0b16; --surface:#1e1826; --elevated:#271f31;
  --text:#f3eefa; --muted:#a79bb8; --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.15); --shadow:0 16px 50px rgba(0,0,0,.55);
  --field:#171220;
}
.af[data-theme="light"]{
  --bg:#f6f2fb; --bg2:#efe9f5; --surface:#ffffff; --elevated:#ffffff;
  --text:#211a2e; --muted:#736a86; --border:rgba(40,25,60,.09);
  --border2:rgba(40,25,60,.16); --shadow:0 16px 44px rgba(90,60,130,.14);
  --field:#f4f0f9;
}
.af::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(60vw 40vh at 85% -5%, rgba(183,148,246,.16), transparent 60%),
    radial-gradient(50vw 40vh at 0% 8%, rgba(246,165,192,.12), transparent 55%);
}
.af > * { position:relative; z-index:1; }
@media(prefers-reduced-motion: reduce){ .af *{ animation:none !important; transition:none !important; } }

/* header */
.af-header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px 12px; backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 72%, transparent);
  border-bottom:1px solid var(--border);
}
.af-brand{ display:flex; align-items:center; gap:10px; }
.af-mark{ width:24px; height:24px; border-radius:8px; background:var(--aura);
  box-shadow:0 0 18px rgba(183,148,246,.5); }
.af-word{ font-family:'Fraunces',serif; font-weight:600; font-size:23px; letter-spacing:-.01em; }
.af-icon-btn{
  width:38px; height:38px; display:grid; place-items:center; border-radius:12px;
  background:var(--surface); border:1px solid var(--border); color:var(--text); cursor:pointer;
  transition:transform .15s, background .2s;
}
.af-icon-btn:active{ transform:scale(.92); }

/* views */
.af-main{ padding:8px 16px 0; max-width:760px; margin:0 auto; }
.af-view{ animation:fade .35s ease; }
.af-viewhead{ display:flex; align-items:flex-end; justify-content:space-between; padding:14px 2px 14px; }
.af-h1{ font-family:'Fraunces',serif; font-weight:600; font-size:30px; margin:0; letter-spacing:-.02em; }
.af-sub{ color:var(--muted); font-size:13.5px; margin:2px 0 0; }

.af-filters{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none; }
.af-filters::-webkit-scrollbar{ display:none; }

/* chips */
.af-chip{
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
  background:var(--surface); color:var(--muted); border:1px solid var(--border);
  transition:all .18s;
}
.af-chip.on{ color:#1b1226; background:var(--aura); border-color:transparent; box-shadow:0 6px 18px rgba(183,148,246,.35); }
.af-chip:active{ transform:scale(.95); }
.af-emoji{ font-size:14px; line-height:1; }
.af-chiprow{ display:flex; flex-wrap:wrap; gap:8px; }

/* masonry closet */
.af-masonry{ column-count:2; column-gap:12px; padding-bottom:20px; }
@media(min-width:560px){ .af-masonry{ column-count:3; } }
@media(min-width:760px){ .af-masonry{ column-count:4; } }
.af-card{
  display:block; width:100%; margin:0 0 12px; break-inside:avoid; position:relative;
  border-radius:20px; overflow:hidden; cursor:pointer; border:1px solid var(--border);
  background:var(--surface); padding:0; text-align:left;
  transition:transform .2s, box-shadow .2s;
}
.af-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
.af-card:active{ transform:scale(.98); }
.af-card img{ width:100%; display:block; }
.af-glow{ position:absolute; inset:-30% -10% 30%; filter:blur(38px); opacity:.42; z-index:0; }
.af-glow.soft{ opacity:.3; }
.af-glow.big{ inset:-20%; filter:blur(55px); opacity:.4; }
.af-card img, .af-cardmeta{ position:relative; z-index:1; }
.af-cardmeta{ display:flex; align-items:center; justify-content:space-between; gap:6px; padding:9px 12px 11px; }
.af-cardname{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.af-wornpill{ font-size:11px; font-weight:700; color:var(--muted); }

/* outfit grid */
.af-outfitgrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding-bottom:20px; }
@media(min-width:620px){ .af-outfitgrid{ grid-template-columns:1fr 1fr 1fr; } }
.af-outfit{
  text-align:left; cursor:pointer; padding:0; border-radius:22px; overflow:hidden;
  border:1px solid var(--border); background:var(--surface);
  transition:transform .2s, box-shadow .2s;
}
.af-outfit:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
.af-outfit:active{ transform:scale(.98); }
.af-collage{ display:grid; gap:2px; aspect-ratio:1; background:var(--border); }
.af-collage.n1{ grid-template-columns:1fr; }
.af-collage.n2{ grid-template-columns:1fr 1fr; }
.af-collage.n3{ grid-template-columns:1fr 1fr; }
.af-collage.n3 .af-tile:first-child{ grid-row:span 2; }
.af-collage.n4{ grid-template-columns:1fr 1fr; }
.af-tile{ position:relative; overflow:hidden; background:var(--bg2); }
.af-tile img{ width:100%; height:100%; object-fit:cover; position:relative; z-index:1; }
.af-outfitfoot{ padding:11px 13px 13px; }
.af-outfitname{ font-weight:600; font-size:14px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.af-outfitmeta{ margin-top:4px; }
.af-recent{ font-size:11.5px; font-weight:700; color:var(--a3); }
.af-muted-sm{ font-size:11.5px; color:var(--muted); }

/* history */
.af-stats{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
.af-stat{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:18px;
  background:var(--surface); border:1px solid var(--border); }
.af-stat-ic{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
  background:var(--aura); color:#1b1226; }
.af-stat-lbl{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; }
.af-stat-val{ display:block; font-size:14.5px; font-weight:700; margin-top:1px; }
.af-timeline{ display:flex; flex-direction:column; gap:12px; padding-bottom:20px; }
.af-tlrow{ display:flex; gap:12px; }
.af-tldate{ flex-shrink:0; width:42px; text-align:center; padding-top:14px; }
.af-tld{ display:block; font-family:'Fraunces',serif; font-size:20px; font-weight:600; line-height:1; }
.af-tlm{ display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.af-tlcard{ flex:1; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px;
  background:var(--surface); border:1px solid var(--border); }
.af-tlimgs{ display:flex; }
.af-tlimgs img{ width:38px; height:46px; object-fit:cover; border-radius:9px; margin-left:-10px;
  border:2px solid var(--surface); }
.af-tlimgs img:first-child{ margin-left:0; }
.af-tlinfo{ flex:1; min-width:0; }
.af-tlname{ font-weight:600; font-size:13.5px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.af-tltags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:3px; }
.af-inlinetag{ display:inline-flex; align-items:center; gap:3px; font-size:11px; color:var(--muted); }

/* empty */
.af-empty{ text-align:center; padding:56px 24px; max-width:340px; margin:0 auto; }
.af-emptyic{ font-size:52px; margin-bottom:14px; }
.af-emptyt{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0 0 8px; }
.af-emptyb{ color:var(--muted); font-size:14px; line-height:1.55; margin:0 0 22px; }
.af-none{ color:var(--muted); text-align:center; padding:40px 0; font-size:14px; }

/* buttons */
.af-primary{
  width:100%; display:flex; align-items:center; justify-content:center; gap:9px; margin-top:18px;
  padding:15px; border-radius:16px; border:none; cursor:pointer;
  font-family:inherit; font-weight:700; font-size:15px; color:#1b1226; background:var(--aura);
  box-shadow:0 10px 26px rgba(183,148,246,.4); transition:transform .15s;
}
.af-primary.compact{ width:auto; padding:13px 22px; margin-top:0; }
.af-primary:active{ transform:scale(.97); }
.af-ghost{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:12px;
  background:var(--surface); border:1px solid var(--border2); color:var(--text);
  font-family:inherit; font-weight:600; font-size:13.5px; cursor:pointer; transition:transform .15s; }
.af-ghost:active{ transform:scale(.95); }
.af-danger{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px;
  padding:13px; border-radius:14px; cursor:pointer; font-family:inherit; font-weight:600; font-size:14px;
  color:var(--danger); background:transparent; border:1px solid var(--border2); transition:transform .15s; }
.af-danger.ghost{ margin-top:0; width:auto; padding:9px 15px; }
.af-danger:active{ transform:scale(.96); }

/* FAB */
.af-fab{
  position:fixed; left:50%; transform:translateX(-50%); bottom:88px; z-index:30;
  display:flex; align-items:center; gap:8px; padding:13px 22px 13px 18px; border-radius:999px; border:none;
  font-family:inherit; font-weight:700; font-size:14.5px; color:#1b1226; background:var(--aura);
  box-shadow:0 12px 34px rgba(183,148,246,.5); cursor:pointer; animation:fabin .4s ease; transition:transform .15s;
}
@keyframes fabin{ from{ transform:translateX(-50%) translateY(12px); opacity:0; } to{ transform:translateX(-50%) translateY(0); opacity:1; } }
.af-fab:active{ transform:translateX(-50%) scale(.95); }

/* bottom nav */
.af-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:space-around;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom)); backdrop-filter:blur(16px);
  background:color-mix(in srgb, var(--bg) 82%, transparent); border-top:1px solid var(--border);
}
.af-navbtn{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 18px;
  background:none; border:none; color:var(--muted); font-family:inherit; font-size:11px; font-weight:600;
  cursor:pointer; transition:color .2s, transform .15s; }
.af-navbtn.on{ color:var(--text); }
.af-navbtn.on svg{ color:var(--a1); }
.af-navbtn:active{ transform:scale(.9); }

/* overlay + sheet */
.af-overlay{ position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(10,6,16,.55); backdrop-filter:blur(6px); animation:fade .25s ease; }
@media(min-width:620px){ .af-overlay{ align-items:center; padding:20px; } }
.af-sheet{ width:100%; max-width:480px; max-height:92vh; overflow-y:auto; background:var(--bg);
  border:1px solid var(--border); border-radius:26px 26px 0 0; box-shadow:var(--shadow);
  animation:slideup .3s cubic-bezier(.2,.9,.3,1); }
.af-sheet.wide{ max-width:560px; }
@media(min-width:620px){ .af-sheet{ border-radius:26px; animation:pop .3s ease; } }
.af-sheethead{ position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between;
  gap:10px; padding:14px 14px 12px; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
.af-sheettitle{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; flex:1; text-align:center;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.af-sheetbody{ padding:18px; }

/* fields + inputs */
.af-field{ display:block; margin-top:16px; }
.af-fieldlbl{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px;
  text-transform:uppercase; letter-spacing:.05em; }
.af-input{ width:100%; padding:13px 14px; border-radius:13px; border:1px solid var(--border2);
  background:var(--field); color:var(--text); font-family:inherit; font-size:15px; outline:none;
  transition:border-color .2s, box-shadow .2s; }
.af-input:focus{ border-color:var(--a1); box-shadow:0 0 0 3px rgba(183,148,246,.18); }
.af-input.big{ font-size:17px; font-weight:600; }
.af-two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.af-two .af-field{ margin-top:16px; }
.af-inputwrap{ display:flex; align-items:center; gap:8px; }
.af-inputwrap .af-input{ flex:1; }
.af-swatch{ width:22px; height:22px; border-radius:7px; flex-shrink:0; border:1px solid var(--border2); }
.af-swatch.sm{ width:14px; height:14px; border-radius:5px; }
.af-mini{ width:44px; height:46px; flex-shrink:0; display:grid; place-items:center; border-radius:13px;
  background:var(--surface); border:1px solid var(--border2); color:var(--text); cursor:pointer; transition:transform .15s; }
.af-mini:active{ transform:scale(.9); }

/* upload */
.af-drop{ width:100%; display:flex; flex-direction:column; align-items:center; gap:8px; padding:44px 20px;
  border-radius:20px; border:1.5px dashed var(--border2); background:var(--surface); color:var(--muted);
  cursor:pointer; font-family:inherit; transition:border-color .2s, transform .15s; }
.af-drop:active{ transform:scale(.98); }
.af-drop-t{ font-weight:700; font-size:15px; color:var(--text); }
.af-drop-s{ font-size:12.5px; text-align:center; max-width:220px; }
.af-preview{ position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border);
  background:var(--surface); display:flex; justify-content:center; }
.af-preview img{ max-height:320px; width:auto; max-width:100%; display:block; position:relative; z-index:1; }
.af-repick{ position:absolute; top:10px; right:10px; z-index:2; padding:7px 13px; border-radius:999px;
  background:rgba(20,12,28,.6); backdrop-filter:blur(8px); color:#fff; border:1px solid rgba(255,255,255,.2);
  font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
.af-ai{ width:100%; display:flex; align-items:center; justify-content:center; gap:9px; margin-top:14px;
  padding:13px; border-radius:14px; cursor:pointer; font-family:inherit; font-weight:700; font-size:14px;
  color:var(--text); background:var(--surface); border:1px solid var(--a1);
  box-shadow:0 0 0 3px rgba(183,148,246,.1); transition:transform .15s; }
.af-ai:active{ transform:scale(.97); }
.af-ai:disabled{ opacity:.7; }

/* detail bits */
.af-detailtags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.af-dt{ display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px;
  background:var(--surface); border:1px solid var(--border); font-size:13px; font-weight:600; text-transform:capitalize; }
.af-wornline{ display:flex; align-items:center; gap:8px; margin-top:16px; color:var(--muted); font-size:13.5px; font-weight:600; }
.af-wornline svg{ color:var(--a2); }

/* build */
.af-selstrip{ display:flex; gap:8px; overflow-x:auto; padding:14px 0 6px; min-height:64px; scrollbar-width:none; }
.af-selstrip::-webkit-scrollbar{ display:none; }
.af-selhint{ color:var(--muted); font-size:13px; align-self:center; }
.af-selthumb{ position:relative; flex-shrink:0; width:54px; height:66px; border-radius:12px; overflow:hidden;
  border:1px solid var(--border2); cursor:pointer; }
.af-selthumb img{ width:100%; height:100%; object-fit:cover; }
.af-selx{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
  background:rgba(20,12,28,.75); color:#fff; display:grid; place-items:center; }
.af-pickgroup{ margin-top:18px; }
.af-picklbl{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
.af-pickrow{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
.af-pickrow::-webkit-scrollbar{ display:none; }
.af-picktile{ position:relative; flex-shrink:0; width:74px; height:90px; border-radius:14px; overflow:hidden;
  border:2px solid var(--border); background:var(--surface); cursor:pointer; padding:0; transition:transform .15s; }
.af-picktile.on{ border-color:var(--a1); box-shadow:0 0 0 3px rgba(183,148,246,.25); }
.af-picktile:active{ transform:scale(.94); }
.af-picktile img{ width:100%; height:100%; object-fit:cover; }
.af-pickcheck{ position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%;
  background:var(--aura); color:#1b1226; display:grid; place-items:center; }

/* outfit detail collage */
.af-detailcollage{ display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
.af-detailcollage .af-tile{ width:calc(33.33% - 7px); aspect-ratio:.82; border-radius:16px; border:1px solid var(--border); }
.af-detailcollage .af-tile img{ border-radius:16px; }
.af-statrow{ display:flex; gap:10px; margin-top:18px; }
.af-statcell{ flex:1; text-align:center; padding:14px 8px; border-radius:16px; background:var(--surface);
  border:1px solid var(--border); }
.af-statn{ display:block; font-family:'Fraunces',serif; font-size:22px; font-weight:600; }
.af-statl{ display:block; font-size:11px; color:var(--muted); margin-top:2px; }
.af-warn{ display:flex; align-items:center; gap:9px; padding:12px 14px; border-radius:14px; margin-bottom:6px;
  background:color-mix(in srgb, var(--a3) 16%, var(--surface)); border:1px solid color-mix(in srgb, var(--a3) 40%, transparent);
  font-size:13px; font-weight:600; }
.af-warn svg{ color:var(--a3); flex-shrink:0; }
.af-minihist{ margin-top:20px; }
.af-minirow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);
  font-size:12.5px; }
.af-minirow > span:first-child{ font-weight:600; }
.af-minitag{ flex:1; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.af-detailactions{ display:flex; gap:10px; margin-top:18px; }
.af-detailactions .af-ghost{ flex:1; justify-content:center; }
.af-wearsub{ color:var(--muted); font-size:14px; margin:0 0 4px; font-weight:600; }

/* hearts */
.af-hearts{ display:flex; gap:6px; }
.af-hearts.inline{ gap:2px; justify-content:center; }
.af-heart{ background:none; border:none; padding:0; cursor:pointer; color:var(--border2); transition:transform .12s, color .18s; }
.af-heart.on{ color:var(--a2); }
.af-heart.ro{ cursor:default; }
.af-heart:not(.ro):active{ transform:scale(.8); }

/* splash */
.af-splash{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
.af-logo-mark{ width:56px; height:56px; border-radius:18px; background:var(--aura);
  box-shadow:0 0 40px rgba(183,148,246,.6); animation:breathe 1.6s ease-in-out infinite; }
.af-splash-txt{ color:var(--muted); font-size:14px; font-weight:600; }

/* toast */
.af-toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:160px; z-index:60;
  padding:12px 20px; border-radius:999px; background:var(--elevated); color:var(--text);
  border:1px solid var(--border2); box-shadow:var(--shadow); font-size:13.5px; font-weight:600;
  animation:toast .3s ease; }

.af-spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes slideup{ from{ transform:translateY(40px); opacity:.6; } to{ transform:translateY(0); opacity:1; } }
@keyframes pop{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
@keyframes toast{ from{ transform:translateX(-50%) translateY(10px); opacity:0; } to{ transform:translateX(-50%) translateY(0); opacity:1; } }
@keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.85; } 50%{ transform:scale(1.08); opacity:1; } }
.af-in{ animation:fadeup .45s ease both; }
@keyframes fadeup{ from{ transform:translateY(14px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

/* upload area (two options) */
.af-droparea{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:32px 22px; border-radius:20px;
  border:1.5px dashed var(--border2); background:var(--surface); text-align:center; }
.af-dropicon{ width:60px; height:60px; border-radius:18px; display:grid; place-items:center;

    return JSON.parse(text.replace(/```json/gi, "").replace(/```/g, "").trim());
  }

  /* ================= persistence (IndexedDB) ================= */
  const IDB_NAME = "aurafit", IDB_STORE = "kv";
  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function idbReq(mode, fn) {
    return idbOpen().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, mode); const r = fn(tx.objectStore(IDB_STORE));
      tx.oncomplete = () => resolve(r && r.result); tx.onerror = () => reject(tx.error);
    }));
  }
  const idbGet = (k) => idbReq("readonly", (os) => os.get(k)).then((v) => (v === undefined ? null : v));
  const idbSet = (k, v) => idbReq("readwrite", (os) => os.put(v, k));
  const idbDel = (k) => idbReq("readwrite", (os) => os.delete(k));
  const idbKeys = (p) => idbReq("readonly", (os) => os.getAllKeys()).then((ks) => (ks || []).filter((k) => String(k).startsWith(p)));
  const store = {
    async get(k) { try { return await idbGet(k); } catch { return null; } },
    async set(k, v) { try { await idbSet(k, v); } catch {} },
    async del(k) { try { await idbDel(k); } catch {} },
    async list(p) { try { return await idbKeys(p); } catch { return []; } },
  };

  /* ================= state ================= */
  const S = { tab: "closet", theme: "dark", items: [], outfits: [], logs: [], plans: [], filter: "all", seeded: false, styles: [], onboarded: false, stylist: { temp: "mild", cond: "sunny", occasion: "casual", result: null }, cal: { y: new Date().getFullYear(), m: new Date().getMonth() } };
  const app = document.getElementById("app");

  const itemById = (id) => S.items.find((i) => i.id === id);
  function itemWearMap() {
    const m = {}; S.items.forEach((i) => (m[i.id] = 0));
    S.logs.forEach((l) => { const o = S.outfits.find((x) => x.id === l.outfitId); if (o) o.itemIds.forEach((id) => { if (m[id] != null) m[id]++; }); });
    return m;
  }
  function outfitStat(id) {
    const s = { count: 0, last: null, conf: [] };
    S.logs.forEach((l) => { if (l.outfitId !== id) return; s.count++; s.conf.push(l.confidence || 0); if (!s.last || l.date > s.last) s.last = l.date; });
    return s;
  }

  /* ================= mutations ================= */
  async function addItem(it) {
    const full = Object.assign({ id: uid(), createdAt: Date.now() }, it);
    S.items.unshift(full); await store.set("item:" + full.id, full); toast("Added to your closet"); render();
  }
  async function removeItem(id) {
    S.items = S.items.filter((i) => i.id !== id);
    S.outfits = S.outfits.map((o) => Object.assign({}, o, { itemIds: o.itemIds.filter((x) => x !== id) }));
    await store.del("item:" + id); await store.set("outfits", S.outfits); toast("Removed"); render();
  }
  async function saveOutfit(o) {
    if (o.id) { S.outfits = S.outfits.map((x) => (x.id === o.id ? o : x)); toast("Outfit updated"); }
    else { S.outfits.unshift(Object.assign({ id: uid(), createdAt: Date.now() }, o)); toast("Outfit saved"); }
    await store.set("outfits", S.outfits); render();
  }
  async function removeOutfit(id) {
    S.outfits = S.outfits.filter((o) => o.id !== id); S.logs = S.logs.filter((l) => l.outfitId !== id);
    S.plans = S.plans.map((p) => (p.outfitId === id ? Object.assign({}, p, { outfitId: null }) : p));
    await store.set("outfits", S.outfits); await store.set("logs", S.logs); await store.set("plans", S.plans); toast("Outfit deleted"); render();
  }
  async function logWear(l) {

    await store.set("logs", S.logs); toast("Logged — looking good ✨"); render();

  async function savePlan(p) {
    const id = p.id || uid();
    const rec = Object.assign({ createdAt: Date.now() }, p, { id });
    S.plans = S.plans.filter((x) => x.id !== id && x.date !== rec.date);

    await store.set("plans", S.plans); toast(p.id ? "Plan updated" : "Saved to calendar"); render();

    const byDate = {}; S.plans.forEach((p) => (byDate[p.date] = p));

    for (let dnum = 1; dnum <= days; dnum++) {
      const ds = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(dnum).padStart(2, "0");
      const p = byDate[ds]; const isT = ds === t; const past = ds < t;

  /* ================= stylist engine ================= */
  const pickRand = (a) => a[Math.floor(Math.random() * a.length)];
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const lc = (s) => (s || "").toLowerCase();
  const styleLabels = (ids) => ids.map((id) => (STYLES.find((s) => s.id === id) || {}).label).filter(Boolean);
  function seasonsForTemp(temp) {
    return ({ hot: ["summer", "all"], warm: ["summer", "spring", "all"], mild: ["spring", "autumn", "all"], cool: ["autumn", "all", "winter"], cold: ["winter", "autumn", "all"] })[temp] || ["all"];
  }
  function scoreItem(it, styles, occasion) {
    const style = lc(it.style), name = lc(it.name), col = lc(it.colorName);
    let s = 0;
    styles.forEach((sid) => {
      (STYLE_KEYWORDS[sid] || []).forEach((k) => { if (style.includes(k) || name.includes(k)) s += 3; });
      if ((STYLE_COLORS[sid] || []).includes(col)) s += 1.2;
    });
    (OCCASION_STYLE[occasion] || []).forEach((k) => { if (style.includes(k) || name.includes(k)) s += 2.5; });
    return s;
  }
  function pickBest(pool, styles, occasion) {
    if (!pool.length) return null;
    const scored = pool.map((it) => ({ it, s: scoreItem(it, styles, occasion) + Math.random() * 1.6 }));
    scored.sort((a, b) => b.s - a.s);
    const topN = scored.slice(0, Math.min(3, scored.length));
    return pickRand(topN).it;
  }
  function generateOutfit() {
    const { temp, cond, occasion } = S.stylist;
    const styles = S.styles.length ? S.styles : ["casual"];
    const seasons = seasonsForTemp(temp);
    const ofType = (type) => { const pool = S.items.filter((i) => i.type === type); const se = pool.filter((i) => seasons.includes(i.season || "all")); return se.length ? se : pool; };
    const chosen = [];
    const top = pickBest(ofType("top"), styles, occasion); if (top) chosen.push(top);
    const bottom = pickBest(ofType("bottom"), styles, occasion); if (bottom) chosen.push(bottom);
    const shoes = pickBest(ofType("shoes"), styles, occasion); if (shoes) chosen.push(shoes);
    let jacket = null;
    if (["cool", "cold"].includes(temp) || ["rainy", "snowy", "windy"].includes(cond)) { jacket = pickBest(ofType("jacket"), styles, occasion); if (jacket) chosen.push(jacket); }
    let hat = null;
    if (temp === "cold" || (temp === "hot" && cond === "sunny")) hat = pickBest(ofType("hat"), styles, occasion);
    if (hat && Math.random() > 0.4) chosen.push(hat); else hat = null;
    let acc = null;
    if (cond === "sunny" || temp === "hot") { acc = pickBest(ofType("accessory"), styles, occasion); if (acc && Math.random() > 0.5) chosen.push(acc); else acc = null; }
    const bag = pickBest(ofType("bag"), styles, occasion); if (bag && Math.random() > 0.55) chosen.push(bag);
    if (chosen.length < 2) return null;
    return { itemIds: chosen.map((i) => i.id), note: stylistNote({ top, bottom, shoes, jacket, acc, temp, cond, occasion, styles }) };
  }
  function stylistNote(x) {
    const names = styleLabels(x.styles);
    const styleTxt = names.length ? names.join(" × ").toLowerCase() : "signature";
    const lead = pickRand([
      `For ${x.occasion} in ${x.temp}, ${x.cond} weather — here's your look.`,
      `${cap(x.occasion)} energy, dressed for ${x.temp} and ${x.cond}.`,
      `I styled this for ${x.occasion}: ${x.temp}, ${x.cond}, and very you.`,
    ]);
    const pieces = [x.top, x.bottom, x.shoes].filter(Boolean).map((i) => lc(i.name) || typeMeta(i.type).label);
    let body = pieces.length ? ` ${cap(pieces[0])}${pieces[1] ? " with " + pieces[1] : ""}${pieces[2] ? ", finished with " + pieces[2] : ""}.` : "";
    let extra = "";
    if (x.jacket) extra += ` I layered a ${lc(x.jacket.name) || "jacket"} for the ${x.temp === "cold" ? "cold" : "chill"}.`;
    if (x.acc) extra += ` ${cap(lc(x.acc.name) || "an accessory")} to catch the sun.`;
    const close = names.length ? ` Leaning into your ${styleTxt} side.` : "";
    return (lead + body + extra + close).trim();
  }

  function stylistHtml() {
    const st = S.stylist;
    const styleTags = S.styles.length
      ? S.styles.map((id) => { const s = STYLES.find((x) => x.id === id); return `<span class="af-dt"><span class="af-emoji">${s.emoji}</span>${s.label}</span>`; }).join("")
      : `<button class="af-linkbtn" data-act="editstyle" style="padding:0">Set your style →</button>`;
    const tempChips = TEMP_BANDS.map((b) => chip(st.temp === b.id, "sttemp", b.id, `<span class="af-emoji">${b.emoji}</span>${b.label}`)).join("");
    const condChips = CONDITIONS.map((c) => chip(st.cond === c.id, "stcond", c.id, `<span class="af-emoji">${c.emoji}</span>${c.label}`)).join("");
    const occChips = STYLE_OCCASIONS.map((o) => chip(st.occasion === o, "stocc", o, o)).join("");
    let result = "";
    if (st.result) {
      const imgs = st.result.itemIds.map(itemById).filter(Boolean);
      result = `<div class="af-stylistcard af-in">
        <div class="af-detailcollage">${imgs.map((it) => `<span class="af-tile"><span class="af-glow soft" style="background:${it.colorHex}"></span><img src="${it.image}" alt="${esc(it.name)}"></span>`).join("")}</div>
        <p class="af-stylistnote">${icon("sparkles", 15)}<span>${esc(st.result.note)}</span></p>
        <div class="af-detailactions"><button class="af-ghost" data-act="stregen">${icon("shuffle", 16)}Regenerate</button><button class="af-primary compact" data-act="stsave">${icon("check", 16)}Save look</button></div></div>`;
    }
    const enough = S.items.length >= 2;
    return `<div class="af-view"><div class="af-viewhead"><div><h1 class="af-h1">Stylist</h1><p class="af-sub">Dressed for your vibe, the weather & the moment</p></div><button class="af-ghost" data-act="editstyle">${icon("sparkles", 15)}Style</button></div>
      <div class="af-styline"><span class="af-fieldlbl">Styling for</span><div class="af-detailtags" style="margin-top:8px">${styleTags}</div></div>
      <div class="af-field"><span class="af-fieldlbl">Temperature</span><div class="af-chiprow">${tempChips}</div></div>
      <div class="af-field"><span class="af-fieldlbl">Conditions<button class="af-linkbtn" data-act="stdetect">detect</button></span><div class="af-chiprow">${condChips}</div></div>
      <div class="af-field"><span class="af-fieldlbl">Occasion</span><div class="af-chiprow">${occChips}</div></div>
      ${enough ? `<button class="af-primary" data-act="stgen">${icon("sparkles", 18)}Style me</button>` : `<p class="af-none">Add a few pieces to your closet first, then I can style you.</p>`}
      ${result}</div>`;
  }

  /* ================= render ================= */
  function render() {
    app.className = "af"; app.dataset.theme = S.theme;
    app.innerHTML = headerHtml() + `<main class="af-main">${viewHtml()}</main>` + fabHtml() + navHtml();
  }

  /* ================= toast ================= */
  let toastTimer = null;
  function toast(msg) {
    const old = document.querySelector(".af-toast"); if (old) old.remove();
    const el = document.createElement("div"); el.className = "af-toast"; el.textContent = msg;
    app.appendChild(el); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2200);
  }

  /* ================= sheet helper ================= */
  function openSheet(title, wide) {
    const ov = document.createElement("div"); ov.className = "af-overlay";
    ov.innerHTML = `<div class="af-sheet${wide ? " wide" : ""}"><div class="af-sheethead">
      <button class="af-icon-btn" data-close>${icon("chevronLeft", 18)}</button>
      <span class="af-sheettitle">${esc(title)}</span>
      <button class="af-icon-btn" data-close>${icon("x", 18)}</button></div>
      <div class="af-sheetbody"></div></div>`;
    const body = ov.querySelector(".af-sheetbody");
    const onKey = (e) => { if (e.key === "Escape") close(); };
    function close() { ov.remove(); document.removeEventListener("keydown", onKey); }
    ov.addEventListener("click", (e) => { if (e.target === ov) close(); });
    ov.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", close));
    document.addEventListener("keydown", onKey);
    app.appendChild(ov);
    return { ov, body, close };
  }

  /* ================= add item ================= */
  function openAddItem() {
    const st = { img: null, colorHex: "#9095a0", form: { type: "top", name: "", colorName: "", style: "", season: "all" }, busy: false, tagging: false };
    const sh = openSheet("Add a piece", false);

    function draw() {
      sh.body.innerHTML = st.img ? formHtml() : dropHtml();
      bind();
    }
    function dropHtml() {
      if (st.busy) return `<div class="af-drop busy">${icon("loader", 26, { spin: true })}
        <span class="af-drop-t">Removing background…</span>
        <span class="af-drop-s">Cutting it out on your device</span></div>
        <input type="file" accept="image/*" hidden id="afFile">`;
      return `<div class="af-droparea">
        <div class="af-dropicon">${icon("camera", 30)}</div>
        <span class="af-drop-t">Add a clothing photo</span>
        <span class="af-drop-s">We'll cut it out and place it on a clean white background. Works best on a plain backdrop.</span>
        <div class="af-dropbtns">
          <button class="af-primary compact" data-pick="upload">${icon("upload", 17)}Upload photo</button>
          <button class="af-ghost" data-pick="camera">${icon("camera", 16)}Take photo</button>
        </div></div>
        <input type="file" accept="image/*" hidden id="afFile">`;
    }
    function formHtml() {
      const f = st.form;
      return `<div class="af-preview"><div class="af-glow big" style="background:${st.colorHex}"></div>
        <img src="${st.img}" alt="preview"><button class="af-repick" data-pick="upload">Change</button></div>
        <input type="file" accept="image/*" hidden id="afFile">
        <button class="af-ai" data-ai ${st.tagging ? "disabled" : ""}>${st.tagging ? icon("loader", 17, { spin: true }) : icon("sparkles", 17)}${st.tagging ? "Reading the fabric…" : "Auto-tag with AI"}</button>
        <div class="af-field"><span class="af-fieldlbl">Type</span><div class="af-chiprow">${TYPES.map((t) => chip(f.type === t.id, "ftype", t.id, `<span class="af-emoji">${t.emoji}</span>${t.label}`)).join("")}</div></div>
        <div class="af-field"><span class="af-fieldlbl">Name</span><input class="af-input" id="afName" placeholder="e.g. Cream knit jumper" value="${esc(f.name)}"></div>
        <div class="af-two">
          <label class="af-field"><span class="af-fieldlbl">Colour</span><div class="af-inputwrap"><span class="af-swatch" style="background:${st.colorHex}"></span><input class="af-input" id="afColor" placeholder="colour" value="${esc(f.colorName)}"></div></label>
          <label class="af-field"><span class="af-fieldlbl">Style</span><input class="af-input" id="afStyle" placeholder="e.g. casual" value="${esc(f.style)}"></label>
        </div>
        <div class="af-field"><span class="af-fieldlbl">Season</span><div class="af-chiprow">${SEASONS.map((s) => chip(f.season === s, "fseason", s, s)).join("")}</div></div>
        <button class="af-primary" data-save>${icon("check", 18)}Add to closet</button>`;
    }
    function syncInputs() {
      const n = sh.body.querySelector("#afName"); if (n) st.form.name = n.value;
      const c = sh.body.querySelector("#afColor"); if (c) st.form.colorName = c.value;
      const s = sh.body.querySelector("#afStyle"); if (s) st.form.style = s.value;
    }
    function bind() {
      const fileInput = sh.body.querySelector("#afFile");
      sh.body.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => {
        if (!fileInput) return;
        if (b.dataset.pick === "camera") fileInput.setAttribute("capture", "environment");
        else fileInput.removeAttribute("capture");
        fileInput.click();
      }));
      if (fileInput) fileInput.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0]; if (!file) return;
        st.busy = true; draw();
        try { const r = await processImage(file); st.img = r.dataUrl; st.colorHex = r.colorHex; if (!st.form.colorName) st.form.colorName = r.colorName; }
        catch { toast("Couldn't read that image"); }
        st.busy = false; draw();
      });
      const ai = sh.body.querySelector("[data-ai]");
      if (ai) ai.addEventListener("click", async () => {
        syncInputs(); st.tagging = true; draw();
        try {
          const t = await aiTag(st.img);
          const f = st.form;
          if (TYPES.some((x) => x.id === t.type)) f.type = t.type;
          if (t.name) f.name = t.name;
          if (t.colorName) f.colorName = t.colorName;
          if (t.style) f.style = t.style;
          if (SEASONS.indexOf(t.season) >= 0) f.season = t.season;
          toast("Tagged with AI ✨");
        } catch { toast("AI tagging unavailable — tag it manually"); }
        st.tagging = false; draw();
      });
      sh.body.querySelectorAll("[data-act=ftype]").forEach((b) => b.addEventListener("click", () => { syncInputs(); st.form.type = b.dataset.id; draw(); }));
      sh.body.querySelectorAll("[data-act=fseason]").forEach((b) => b.addEventListener("click", () => { syncInputs(); st.form.season = b.dataset.id; draw(); }));
      ["afName", "afColor", "afStyle"].forEach((id) => { const el = sh.body.querySelector("#" + id); if (el) el.addEventListener("input", syncInputs); });
      const save = sh.body.querySelector("[data-save]");
      if (save) save.addEventListener("click", () => {
        syncInputs(); if (!st.img) { toast("Add a photo first"); return; }
        addItem(Object.assign({ image: st.img, colorHex: st.colorHex }, st.form)); sh.close();
      });
    }
    draw();
  }

  /* ================= item detail ================= */
  function openItemDetail(item) {
    if (!item) return;
    const wear = itemWearMap()[item.id] || 0;
    const sh = openSheet(item.name || typeMeta(item.type).label, false);
    const tags = [
      `<span class="af-dt"><span class="af-emoji">${typeMeta(item.type).emoji}</span>${typeMeta(item.type).label}</span>`,
      item.colorName ? `<span class="af-dt"><span class="af-swatch sm" style="background:${item.colorHex}"></span>${esc(item.colorName)}</span>` : "",
      item.style ? `<span class="af-dt">${esc(item.style)}</span>` : "",
      item.season ? `<span class="af-dt">${esc(item.season)}</span>` : "",
    ].join("");
    sh.body.innerHTML = `<div class="af-preview"><div class="af-glow big" style="background:${item.colorHex}"></div><img src="${item.image}" alt="${esc(item.name)}"></div>
      <div class="af-detailtags">${tags}</div>
      <div class="af-wornline">${icon("heart", 15)}${wear > 0 ? `Worn in ${wear} logged ${wear === 1 ? "wear" : "wears"}` : "Not worn yet"}</div>
      <button class="af-danger" data-del>${icon("trash", 17)}Remove piece</button>`;
    sh.body.querySelector("[data-del]").addEventListener("click", () => { removeItem(item.id); sh.close(); });
  }

  /* ================= build outfit ================= */
  function openBuild(initial) {
    initial = initial || {};
    const st = { id: initial.id || null, createdAt: initial.createdAt, name: initial.name || "", selected: (initial.itemIds || []).slice(), tags: (initial.tags || []).slice(), custom: "" };
    const sh = openSheet(st.id ? "Edit outfit" : "Build an outfit", true);

    function pickOf(type) { const pool = S.items.filter((i) => i.type === type); return pool.length ? pool[Math.floor(Math.random() * pool.length)].id : null; }
    function surprise() {
      const core = ["top", "bottom", "shoes"].map(pickOf).filter(Boolean);
      const extras = ["jacket", "accessory", "hat", "bag"].filter(() => Math.random() > 0.5).map(pickOf).filter(Boolean);
      st.selected = core.concat(extras);
      if (!st.name) st.name = "Surprise look";
      if (!st.selected.length) toast("Add a few pieces first");
      draw();
    }
    function toggle(id) { const i = st.selected.indexOf(id); if (i >= 0) st.selected.splice(i, 1); else st.selected.push(id); draw(); }
    function toggleTag(t) { const i = st.tags.indexOf(t); if (i >= 0) st.tags.splice(i, 1); else st.tags.push(t); draw(); }

    function draw() {
      if (!S.items.length) { sh.body.innerHTML = `<p class="af-none">Your closet is empty — add pieces first.</p>`; return; }
      const selThumbs = st.selected.length
        ? st.selected.map((id) => { const it = itemById(id); return it ? `<span class="af-selthumb" data-unsel="${id}"><img src="${it.image}" alt=""><span class="af-selx">${icon("x", 12)}</span></span>` : ""; }).join("")
        : `<span class="af-selhint">Tap pieces below to add them</span>`;
      const groups = TYPES.map((t) => { const list = S.items.filter((i) => i.type === t.id); if (!list.length) return "";
        return `<div class="af-pickgroup"><span class="af-picklbl"><span class="af-emoji">${t.emoji}</span>${t.label}</span><div class="af-pickrow">` +
          list.map((it) => `<button class="af-picktile${st.selected.indexOf(it.id) >= 0 ? " on" : ""}" data-pick="${it.id}"><img src="${it.image}" alt="">${st.selected.indexOf(it.id) >= 0 ? `<span class="af-pickcheck">${icon("check", 14)}</span>` : ""}</button>`).join("") +
          `</div></div>`; }).join("");
      const presetChips = TAG_PRESETS.map((t) => chip(st.tags.indexOf(t) >= 0, null, null, t).replace("<button", `<button data-tag="${t}"`)).join("");
      const customChips = st.tags.filter((t) => TAG_PRESETS.indexOf(t) < 0).map((t) => `<button type="button" class="af-chip on" data-tag="${esc(t)}">${esc(t)} ✕</button>`).join("");
      sh.body.innerHTML = `<div class="af-inputwrap"><input class="af-input big" id="afOname" placeholder="Name this look" value="${esc(st.name)}"><button class="af-mini" data-surprise title="Surprise me">${icon("shuffle", 16)}</button></div>
        <div class="af-selstrip">${selThumbs}</div>${groups}
        <div class="af-field"><span class="af-fieldlbl">Tags</span><div class="af-chiprow">${presetChips}${customChips}</div>
        <div class="af-inputwrap" style="margin-top:8px"><input class="af-input" id="afTag" placeholder="add your own tag" value="${esc(st.custom)}"><button class="af-mini" data-addtag>${icon("plus", 16)}</button></div></div>
        <button class="af-primary" data-save>${icon("check", 18)}${st.id ? "Save changes" : "Save outfit"}</button>`;
      bind();
    }
    function syncInputs() { const n = sh.body.querySelector("#afOname"); if (n) st.name = n.value; const c = sh.body.querySelector("#afTag"); if (c) st.custom = c.value; }
    function addCustom() { syncInputs(); const v = st.custom.trim().toLowerCase(); if (v && st.tags.indexOf(v) < 0) st.tags.push(v); st.custom = ""; draw(); }
    function bind() {
      const nameEl = sh.body.querySelector("#afOname"); if (nameEl) nameEl.addEventListener("input", () => (st.name = nameEl.value));
      const tagEl = sh.body.querySelector("#afTag");
      if (tagEl) { tagEl.addEventListener("input", () => (st.custom = tagEl.value)); tagEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addCustom(); } }); }
      const sB = sh.body.querySelector("[data-surprise]"); if (sB) sB.addEventListener("click", () => { syncInputs(); surprise(); });
      const aB = sh.body.querySelector("[data-addtag]"); if (aB) aB.addEventListener("click", addCustom);
      sh.body.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => { syncInputs(); toggle(b.dataset.pick); }));
      sh.body.querySelectorAll("[data-unsel]").forEach((b) => b.addEventListener("click", () => { syncInputs(); toggle(b.dataset.unsel); }));
      sh.body.querySelectorAll("[data-tag]").forEach((b) => b.addEventListener("click", () => { syncInputs(); toggleTag(b.dataset.tag); }));
      const save = sh.body.querySelector("[data-save]");
      if (save) save.addEventListener("click", () => { syncInputs(); if (!st.selected.length) { toast("Pick at least one piece"); return; } saveOutfit({ id: st.id, name: st.name.trim(), itemIds: st.selected.slice(), tags: st.tags.slice(), createdAt: st.createdAt }); sh.close(); });
    }
    draw();
    if (initial.surprise) surprise();
  }

  /* ================= outfit detail ================= */
  function openOutfitDetail(outfit) {
    if (!outfit) return;
    const sh = openSheet(outfit.name || "Untitled look", true);
    const s = outfitStat(outfit.id);
    const recent = s.last && daysSince(s.last) <= 6;
    const avg = s.conf.length ? Math.round(s.conf.reduce((a, b) => a + b, 0) / s.conf.length) : 0;
    const imgs = outfit.itemIds.map(itemById).filter(Boolean);
    const collage = imgs.map((it) => `<span class="af-tile"><span class="af-glow soft" style="background:${it.colorHex}"></span><img src="${it.image}" alt="${esc(it.name)}"></span>`).join("");
    const tagRow = (outfit.tags && outfit.tags.length) ? `<div class="af-detailtags">${outfit.tags.map((t) => `<span class="af-dt">${esc(t)}</span>`).join("")}</div>` : "";
    const oLogs = S.logs.filter((l) => l.outfitId === outfit.id).slice(0, 4);
    const mini = oLogs.length ? `<div class="af-minihist"><span class="af-picklbl">Recent wears</span>` +
      oLogs.map((l) => `<div class="af-minirow"><span>${fmtDate(l.date)}</span><span class="af-minitag">${esc([l.occasion, l.location].filter(Boolean).join(" · ") || "—")}</span>${heartsHtml(l.confidence, { small: true, readOnly: true })}</div>`).join("") + `</div>` : "";
    sh.body.innerHTML =
      (recent ? `<div class="af-warn">${icon("clock", 15)}You wore this ${daysSince(s.last)} ${daysSince(s.last) === 1 ? "day" : "days"} ago — maybe switch it up?</div>` : "") +
      `<div class="af-detailcollage">${collage}</div>${tagRow}
       <div class="af-statrow">
         <div class="af-statcell"><span class="af-statn">${s.count}</span><span class="af-statl">times worn</span></div>
         <div class="af-statcell"><span class="af-statn">${s.last ? daysSince(s.last) + "d" : "—"}</span><span class="af-statl">since last</span></div>
         <div class="af-statcell"><span class="af-statn">${avg ? heartsHtml(avg, { small: true, readOnly: true, inline: true }) : "—"}</span><span class="af-statl">avg feel</span></div>
       </div>
       <button class="af-primary" data-wear>${icon("calendar", 18)}Wear today</button>${mini}
       <div class="af-detailactions"><button class="af-ghost" data-edit>Edit</button><button class="af-danger ghost" data-del>${icon("trash", 16)}Delete</button></div>`;
    sh.body.querySelector("[data-wear]").addEventListener("click", () => { sh.close(); openWear(outfit); });
    sh.body.querySelector("[data-edit]").addEventListener("click", () => { sh.close(); openBuild(outfit); });
    sh.body.querySelector("[data-del]").addEventListener("click", () => { removeOutfit(outfit.id); sh.close(); });
  }

  /* ================= wear log ================= */
  function openWear(outfit, presetDate) {
    const st = { date: presetDate || today(), occasion: "", location: "", confidence: 4 };
    const sh = openSheet("Log this wear", false);
    function draw() {
      sh.body.innerHTML = `<p class="af-wearsub">${esc(outfit.name || "Untitled look")}</p>
        <label class="af-field"><span class="af-fieldlbl">Date</span><input type="date" class="af-input" id="afDate" value="${st.date}" max="${today()}"></label>
        <div class="af-field"><span class="af-fieldlbl">Occasion</span><div class="af-chiprow">${OCCASIONS.map((o) => chip(st.occasion === o, "occ", o, o)).join("")}</div></div>
        <label class="af-field"><span class="af-fieldlbl">Where / who with</span><input class="af-input" id="afLoc" placeholder="e.g. office, Mia's birthday" value="${esc(st.location)}"></label>
        <div class="af-field"><span class="af-fieldlbl">How did it feel?</span><div id="afHearts">${heartsHtml(st.confidence, { interactive: true })}</div></div>
        <button class="af-primary" data-save>${icon("check", 18)}Save wear</button>`;
      bind();
    }
    function sync() { const d = sh.body.querySelector("#afDate"); if (d) st.date = d.value; const l = sh.body.querySelector("#afLoc"); if (l) st.location = l.value; }
    function bind() {
      const d = sh.body.querySelector("#afDate"); if (d) d.addEventListener("input", () => (st.date = d.value));
      const l = sh.body.querySelector("#afLoc"); if (l) l.addEventListener("input", () => (st.location = l.value));
      sh.body.querySelectorAll("[data-act=occ]").forEach((b) => b.addEventListener("click", () => { sync(); st.occasion = st.occasion === b.dataset.id ? "" : b.dataset.id; draw(); }));
      sh.body.querySelectorAll("[data-heart]").forEach((b) => b.addEventListener("click", () => { st.confidence = +b.dataset.heart; const c = sh.body.querySelector("#afHearts"); if (c) c.innerHTML = heartsHtml(st.confidence, { interactive: true }); bind(); }));
      const save = sh.body.querySelector("[data-save]");
      if (save) save.addEventListener("click", () => { sync(); logWear({ outfitId: outfit.id, date: st.date, occasion: st.occasion, location: st.location, confidence: st.confidence }); sh.close(); });
    }
    draw();
  }

  /* ================= plan a date ================= */
  function openPlan(dateStr, plan) {
    const editing = !!plan;
    const st = { date: (plan && plan.date) || dateStr || today(), event: (plan && plan.event) || "", outfitId: (plan && plan.outfitId) || null, note: (plan && plan.note) || "" };
    const sh = openSheet(editing ? "Edit plan" : "Plan an outfit", true);
    function opt(id, imgsHtml, name, on) {
      return `<button type="button" class="af-planopt${on ? " on" : ""}" data-opt="${id}"><div class="af-planopt-imgs">${imgsHtml}</div><span class="af-planopt-name">${name}</span>${on ? `<span class="af-planopt-check">${icon("check", 14)}</span>` : ""}</button>`;
    }
    function draw() {
      const decide = opt("", `<span class="af-planempty sm">${icon("sparkles", 16)}</span>`, "Decide later", !st.outfitId);
      const opts = S.outfits.map((o) => {
        const it = o.itemIds.map(itemById).filter(Boolean)[0];
        const img = it ? `<img src="${it.image}" alt="">` : `<span class="af-planempty sm">${icon("layers", 16)}</span>`;
        return opt(o.id, img, esc(o.name || "Untitled look"), st.outfitId === o.id);
      }).join("");
      const canWear = st.outfitId && st.date <= today();
      sh.body.innerHTML = `<label class="af-field"><span class="af-fieldlbl">Date</span><input type="date" class="af-input" id="afPDate" value="${st.date}"></label>
        <label class="af-field"><span class="af-fieldlbl">Occasion / event</span><input class="af-input" id="afPEvent" placeholder="e.g. Sarah's wedding" value="${esc(st.event)}"></label>
        <div class="af-field"><span class="af-fieldlbl">Outfit</span><div class="af-planopts">${decide}${opts}</div>${S.outfits.length ? "" : `<p class="af-none" style="padding:12px 0 0">No saved outfits yet — build one in Outfits, or plan now and choose later.</p>`}</div>
        <label class="af-field"><span class="af-fieldlbl">Note</span><input class="af-input" id="afPNote" placeholder="optional — dress code, location…" value="${esc(st.note)}"></label>
        ${canWear ? `<button class="af-ghost af-planwear" data-wear>${icon("check", 16)}Mark as worn</button>` : ""}
        <button class="af-primary" data-save>${icon("check", 18)}${editing ? "Save plan" : "Add to calendar"}</button>
        ${editing ? `<button class="af-danger" data-del>${icon("trash", 17)}Remove plan</button>` : ""}`;
      bind();
    }
    function sync() { const d = sh.body.querySelector("#afPDate"); if (d) st.date = d.value; const e = sh.body.querySelector("#afPEvent"); if (e) st.event = e.value; const n = sh.body.querySelector("#afPNote"); if (n) st.note = n.value; }
    function bind() {
      const d = sh.body.querySelector("#afPDate"); if (d) d.addEventListener("change", () => { st.date = d.value; draw(); });
      const e = sh.body.querySelector("#afPEvent"); if (e) e.addEventListener("input", () => (st.event = e.value));
      const n = sh.body.querySelector("#afPNote"); if (n) n.addEventListener("input", () => (st.note = n.value));
      sh.body.querySelectorAll("[data-opt]").forEach((b) => b.addEventListener("click", () => { sync(); st.outfitId = b.dataset.opt || null; draw(); }));
      const w = sh.body.querySelector("[data-wear]"); if (w) w.addEventListener("click", () => { sync(); const o = S.outfits.find((x) => x.id === st.outfitId); sh.close(); if (o) openWear(o, st.date); });
      const s = sh.body.querySelector("[data-save]"); if (s) s.addEventListener("click", () => { sync(); savePlan({ id: plan && plan.id, date: st.date, event: st.event.trim(), outfitId: st.outfitId, note: st.note.trim() }); sh.close(); });
      const del = sh.body.querySelector("[data-del]"); if (del) del.addEventListener("click", () => { removePlan(plan.id); sh.close(); });
    }
    draw();
  }

  /* ================= style quiz ================= */
  function openStyleQuiz() {
    const st = { sel: S.styles.slice() };
    const sh = openSheet("What's your style?", true);
    function draw() {
      sh.body.innerHTML = `<p class="af-quizsub">Pick 1–3 aesthetics so your stylist knows your vibe. You can change these anytime.</p>
        <div class="af-stylegrid">${STYLES.map((s) => `<button type="button" class="af-styletile${st.sel.includes(s.id) ? " on" : ""}" data-style="${s.id}"><span class="af-styleemoji">${s.emoji}</span><span class="af-stylename">${s.label}</span>${st.sel.includes(s.id) ? `<span class="af-styletick">${icon("check", 13)}</span>` : ""}</button>`).join("")}</div>
        <button class="af-primary" data-save ${st.sel.length ? "" : "disabled"}>${icon("check", 18)}${st.sel.length ? `Save ${st.sel.length} ${st.sel.length === 1 ? "style" : "styles"}` : "Pick at least one"}</button>
        <button class="af-ghost af-quizskip" data-skip>Skip for now</button>`;
      bind();
    }
    function bind() {
      sh.body.querySelectorAll("[data-style]").forEach((b) => b.addEventListener("click", () => {
        const id = b.dataset.style, i = st.sel.indexOf(id);
        if (i >= 0) st.sel.splice(i, 1);
        else { if (st.sel.length >= 3) { toast("Pick up to 3"); return; } st.sel.push(id); }
        draw();
      }));
      const s = sh.body.querySelector("[data-save]"); if (s) s.addEventListener("click", () => { if (!st.sel.length) return; saveStyles(st.sel); sh.close(); });
      const sk = sh.body.querySelector("[data-skip]"); if (sk) sk.addEventListener("click", () => { markOnboarded(); sh.close(); });
    }
    draw();
  }
  async function saveStyles(sel) { S.styles = sel; S.onboarded = true; await persistSettings(); toast("Style saved ✨"); render(); }
  async function markOnboarded() { S.onboarded = true; await persistSettings(); }

  async function detectWeather() {
    if (!navigator.geolocation) { toast("Set the weather manually"); return; }
    toast("Checking the weather…");
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
      const { latitude, longitude } = pos.coords;
      const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + latitude + "&longitude=" + longitude + "&current=temperature_2m,weather_code");
      const d = await r.json();
      const tC = d.current.temperature_2m, code = d.current.weather_code;
      S.stylist.temp = tC >= 25 ? "hot" : tC >= 18 ? "warm" : tC >= 12 ? "mild" : tC >= 6 ? "cool" : "cold";
      S.stylist.cond = [71, 73, 75, 77, 85, 86].includes(code) ? "snowy" : [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code) ? "rainy" : [0, 1].includes(code) ? "sunny" : "cloudy";
      render(); toast("Weather: " + Math.round(tC) + "°, " + S.stylist.cond);
    } catch (e) { toast("Couldn't detect — set it manually"); }
  }

  /* ================= root delegation ================= */
  document.addEventListener("click", (e) => {
    const t = e.target.closest && e.target.closest("[data-act]"); if (!t) return;
    const act = t.dataset.act, id = t.dataset.id;
    if (act === "theme") { S.theme = S.theme === "dark" ? "light" : "dark"; persistSettings(); render(); }
    else if (act === "tab") { S.tab = id; render(); }
    else if (act === "filter") { S.filter = id; render(); }
    else if (act === "add") openAddItem();
    else if (act === "fab") { S.tab === "closet" ? openAddItem() : S.tab === "outfits" ? openBuild({}) : openPlan(today(), S.plans.find((p) => p.date === today())); }
    else if (act === "item") openItemDetail(itemById(id));
    else if (act === "build") openBuild({});
    else if (act === "surprise") openBuild({ surprise: true });
    else if (act === "outfit") openOutfitDetail(S.outfits.find((o) => o.id === id));
    else if (act === "calprev") { if (--S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } render(); }
    else if (act === "calnext") { if (++S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } render(); }
    else if (act === "caltoday") { const n = new Date(); S.cal = { y: n.getFullYear(), m: n.getMonth() }; render(); }
    else if (act === "calday") openPlan(id, S.plans.find((p) => p.date === id));
    else if (act === "planedit") openPlan(null, S.plans.find((p) => p.id === id));
    else if (act === "sttemp") { S.stylist.temp = id; render(); }
    else if (act === "stcond") { S.stylist.cond = id; render(); }
    else if (act === "stocc") { S.stylist.occasion = id; render(); }
    else if (act === "stgen" || act === "stregen") { const r = generateOutfit(); if (!r) toast("Not enough pieces to style a look yet"); else S.stylist.result = r; render(); }
    else if (act === "stsave") { if (S.stylist.result) openBuild({ name: cap(S.stylist.occasion) + " look", itemIds: S.stylist.result.itemIds.slice() }); }
    else if (act === "editstyle") openStyleQuiz();
    else if (act === "stdetect") detectWeather();
  });

  /* ================= one-time demo cleanup ================= */
  async function cleanupDemo() {
    const demoIds = S.items.filter((i) => typeof i.image === "string" && i.image.indexOf("data:image/svg+xml") === 0).map((i) => i.id);
    if (!demoIds.length) return;
    const dset = new Set(demoIds);
    for (const id of demoIds) await store.del("item:" + id);
    S.items = S.items.filter((i) => !dset.has(i.id));
    const kept = [], removedOutfits = new Set();
    for (const o of S.outfits) {
      const ids = o.itemIds.filter((x) => !dset.has(x));
      if (o.itemIds.length && ids.length === 0) removedOutfits.add(o.id);
      else kept.push(Object.assign({}, o, { itemIds: ids }));
    }
    S.outfits = kept;
    S.logs = S.logs.filter((l) => !removedOutfits.has(l.outfitId));
    await store.set("outfits", S.outfits);
    await store.set("logs", S.logs);
  }

  /* ================= boot ================= */
  function splash() {
    app.className = "af"; app.dataset.theme = S.theme;
    app.innerHTML = `<div class="af-splash"><div class="af-logo-mark"></div><p class="af-splash-txt">Opening your closet…</p></div>`;
  }
  async function boot() {
    splash();
    const settings = await store.get("settings");
    if (settings) { if (settings.theme) S.theme = settings.theme; S.seeded = !!settings.seeded; S.styles = settings.styles || []; S.onboarded = !!settings.onboarded; }
    const keys = await store.list("item:"); const items = [];
    for (const k of keys) { const it = await store.get(k); if (it) items.push(it); }
    items.sort((a, b) => b.createdAt - a.createdAt); S.items = items;
    S.outfits = (await store.get("outfits")) || [];
    S.logs = (await store.get("logs")) || [];
    S.plans = (await store.get("plans")) || [];
    await cleanupDemo();
    render();
    if (!S.onboarded) openStyleQuiz();
  }
  boot();
})();

</script>
</body>
</html>
